<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>html,body,#map{height:100%;margin:0;background:#e8edf2}.leaflet-container{overflow:hidden;position:relative;outline:0}.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-shadow-pane,.leaflet-tile-container,.leaflet-pane>svg{position:absolute;left:0;top:0}.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-popup-pane{z-index:700}.leaflet-tile{visibility:inherit}.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-left{left:0}.leaflet-control{position:relative;z-index:800;pointer-events:auto;margin:10px}.leaflet-control-zoom{border:1px solid #999;border-radius:4px;background:white}.leaflet-control-zoom a{display:block;width:28px;height:28px;line-height:28px;text-align:center;font:22px sans-serif;color:#222;text-decoration:none;border-bottom:1px solid #ccc}.leaflet-control-zoom a:last-child{border:0}.leaflet-popup-content{font:14px sans-serif}.loading{padding:16px;font:14px sans-serif;color:#374151}</style></head><body><div id="map"><div class="loading">Loading live map…</div></div><script src="leaflet.js"></script><script>const map=L.map('map').setView([23.8103,90.4125],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const markers={};window.setVehicles=function(items){const ids=new Set(items.map(x=>x.id));Object.keys(markers).forEach(id=>{if(!ids.has(id)){map.removeLayer(markers[id]);delete markers[id]}});const points=[];items.forEach(x=>{const popup='<b>'+x.name+'</b><br>'+x.speed.toFixed(1)+' km/h<br>'+x.fixTime;if(markers[x.id]){markers[x.id].setLatLng([x.latitude,x.longitude]).setPopupContent(popup)}else{markers[x.id]=L.circleMarker([x.latitude,x.longitude],{radius:8,color:'#0f766e',fillColor:'#14b8a6',fillOpacity:1}).addTo(map).bindPopup(popup)}points.push([x.latitude,x.longitude])});if(points.length===1)map.setView(points[0],15);else if(points.length>1)map.fitBounds(points,{padding:[24,24],maxZoom:15})};</script></body></html>
